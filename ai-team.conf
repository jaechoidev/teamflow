# ai-team workspace configuration.
#
# cli:      codex | claude | zai
#           zai = Claude Code routed through the z.ai backend (env file below),
#           running GLM models. No API keys live in this file.
# model:    passed to the CLI as --model (codex: -m). Names must be IDs the
#           installed CLI accepts; the launcher reports unavailable models
#           rather than substituting.
# effort:   passed as --effort (claude/zai), or as
#           -c model_reasoning_effort=<value> (codex). Leave empty to use
#           the CLI default.
# worktree: yes = this pane gets a dedicated git worktree + branch
#           ai-team/<role>, created only if absent. no = main checkout.
#
# Pane order below = layout order: the Delegator alone on the left at full
# height, then the right column top to bottom.
#
# Variants: copy this file, edit the copy, and select it with
# --config <file>. One team runs per repo (README: Choosing a config).

[workspace]
# Session prefix; final session name is <prefix>-<project>-<hash-of-root>.
session_prefix = at
# Env file sourced for cli = zai panes (contains the backend URL + token).
zai_env = ~/.zai/env.sh
# Days a done task record survives `ai-team-clean`-style pruning (see task.sh).
task_ttl_days = 7

[pane.delegator]
label = Delegator (codex)
cli = codex
model = gpt-6-sol
effort = medium
worktree = no

[pane.researcher]
label = Researcher (zai glm-5.3)
cli = zai
model = glm-5.3
effort = max
worktree = no

[pane.reviewer]
label = Reviewer & Planner (claude fable)
cli = claude
model = fable
effort = max
worktree = no

[pane.dev-senior]
label = Dev Senior (claude fable)
cli = claude
model = fable
effort = max
worktree = yes

[pane.dev-mid]
label = Dev Mid (claude opus)
cli = claude
model = opus
effort = max
worktree = yes

[pane.dev-junior]
label = Dev Junior (zai glm-5.3)
cli = zai
model = glm-5.3
effort = max
worktree = yes
