# teamflow workspace configuration.
# [type.*] sections are the worker catalog: the CLI, model, and effort of each
# kind of worker, and use_for, which tells the Delegator when to pick it.
# List them with: scripts/teamflow types
# [worker.*] sections are the optional default team that teamflow start
# launches. Without them, the Delegator adds workers on demand with
# scripts/teamflow add <type>. The Notetaker, when present, is last.

[workspace]
session_prefix = tf
zai_env = ~/.zai/env.sh

[type.researcher]
label = Researcher
cli = zai
model = glm-5.3
effort = max
worktree = no
role_file = .agents/roles/researcher.md
use_for = external research, documentation lookups, sources and citations, comparing options
next_id = 2

[type.reviewer]
label = Reviewer
cli = claude
model = fable
effort = xhigh
worktree = no
role_file = .agents/roles/reviewer.md
use_for = reviewing plans, architecture, and diffs before integration
next_id = 2

[type.developer-l]
label = Developer L
cli = claude
model = fable
effort = max
worktree = yes
role_file = .agents/roles/developer.md
use_for = large or risky changes, cross-cutting refactors, hard bugs
next_id = 2

[type.developer-m]
label = Developer M
cli = claude
model = opus
effort = max
worktree = yes
role_file = .agents/roles/developer.md
use_for = typical features and fixes with a clear scope
next_id = 1

[type.developer-s]
label = Developer S
cli = zai
model = glm-5.3
effort = max
worktree = yes
role_file = .agents/roles/developer.md
use_for = small, well-defined edits, docs, and mechanical changes
next_id = 1

[type.notetaker]
label = Notetaker
cli = claude
model = opus
effort = xhigh
worktree = no
role_file = .agents/roles/notetaker.md
use_for = project notes from finished work, only when the user wants notes

# === default team (teamflow start) ===

[worker.researcher-1]
type = researcher

[worker.reviewer-1]
type = reviewer

[worker.developer-l-1]
type = developer-l

# Developer M and S are available through workers add developer-m and
# workers add developer-s. They are not active in this configuration.

[worker.notetaker]
type = notetaker
