# teamflow workspace configuration. Types define worker settings once.
# Worker sections select types and set pane order. The Notetaker is last.
# Add or remove instances with: scripts/teamflow workers add|remove|list

[workspace]
session_prefix = at
zai_env = ~/.zai/env.sh

[pane.delegator]
label = Delegator & Planner (codex)
cli = codex
model = gpt-6-sol
effort = medium
worktree = no

[type.researcher]
label = Researcher
cli = zai
model = glm-5.3
effort = max
worktree = no
role_file = .agents/roles/researcher.md
next_id = 2

[type.reviewer]
label = Reviewer
cli = claude
model = fable
effort = xhigh
worktree = no
role_file = .agents/roles/reviewer.md
next_id = 2

[type.developer-l]
label = Developer L
cli = claude
model = fable
effort = max
worktree = yes
role_file = .agents/roles/developer.md
next_id = 2

[type.developer-m]
label = Developer M
cli = claude
model = opus
effort = max
worktree = yes
role_file = .agents/roles/developer.md
next_id = 1

[type.developer-s]
label = Developer S
cli = zai
model = glm-5.3
effort = max
worktree = yes
role_file = .agents/roles/developer.md
next_id = 1

[type.notetaker]
label = Notetaker
cli = claude
model = opus
effort = xhigh
worktree = no
role_file = .agents/roles/notetaker.md

[worker.researcher-1]
type = researcher

[worker.reviewer-1]
type = reviewer

[worker.developer-l-1]
type = developer-l

# Developer M and S are available through workers add developer-m and
# workers add developer-s. They are not active in this configuration.

[worker.notetaker]
type = notetaker
